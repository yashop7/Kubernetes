apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:latest
          env:
          # User is bydefault in postgres is "postgres"
            - name: POSTGRES_PASSWORD # Setting explicitly password has postgres
              value: postgres
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - protocol: TCP
      port: 5432 # Service PORT
      targetPort: 5432 # POD PORT(where DB is working)
  type: ClusterIP
